name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing; adds provenance to the package

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0 # staged publishing needs npm 11.15.0+
      - run: npm ci
      - run: npm test
      # Staged, not live: a maintainer approves it on npmjs.com with 2FA (https://docs.npmjs.com/staged-publishing).
      - run: npm stage publish
