name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check script syntax
        run: for f in bin/*.mjs skills/seo-supervisor/scripts/*.mjs; do node --check "$f"; done
      - name: Type-check the files marked // @ts-check (TypeScript is a dev-only tool; nothing is compiled or shipped)
        run: npm ci && npm run typecheck
      - name: Crawl the fixture site, scan content, render the report, test the installer
        run: npm test
