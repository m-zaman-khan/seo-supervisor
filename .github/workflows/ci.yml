name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: for f in bin/*.mjs skills/seo-supervisor/scripts/*.mjs; do node --check "$f"; done
      - name: Type-check
        run: npm ci && npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test

  browser:
    name: Chrome tests (Node 22)
    # Chrome's sandbox works for the runner user on 22.04; 24.04 restricts unprivileged user namespaces.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test
        run: npm run test:browser
